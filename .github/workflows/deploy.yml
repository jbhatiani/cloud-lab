name: Deploy Azure Infrastructure via Terraform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  terraform-deploy:
    name: Terraform Init, Plan & Apply
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # subscription-id is intentionally omitted here so it 
          # logs in globally at the tenant/billing level via OIDC.

      - name: Download Previous Terraform State Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: terraform-state
          path: ./terraform

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform Init
        run: terraform init -upgrade
        working-directory: ./terraform

      - name: Auto-Import Existing Management Group (If Present)
        shell: bash
        working-directory: ./terraform
        run: |
          if az account management-group show --name "mg-enterprise-landing-zones" &>/dev/null; then
            echo "Management Group already exists in Azure. Checking state..."
            if ! terraform state list | grep -q "azurerm_management_group.elz"; then
              echo "Importing existing Management Group into Terraform state..."
              terraform import azurerm_management_group.elz "/providers/Microsoft.Management/managementGroups/mg-enterprise-landing-zones"
            fi
          fi

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform
        env:
          TF_VAR_billing_scope_id: ${{ secrets.AZURE_BILLING_SCOPE_ID }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform
        env:
          TF_VAR_billing_scope_id: ${{ secrets.AZURE_BILLING_SCOPE_ID }}

      - name: Upload Terraform State Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: ./terraform/terraform.tfstate
          retention-days: 90