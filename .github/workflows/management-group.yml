name: Deploy Azure Governance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-management-group:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull your repository code down to the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to Azure securely via OIDC at the tenant level
      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # 3. Execute the tenant-level deployment directly, passing parameters
      - name: Deploy Management Group
        run: |
          az deployment tenant create \
            --name "deploy-mg-${{ github.run_number }}" \
            --location "centralus" \
            --template-file "./management-group.bicep" \
            --parameters managementGroupId="mg-enterprise-landing-zones-v4" managementGroupDisplayName="Enterprise Landing Zones"

     # 4. Automatically deploy the subscription at the tenant level via Azure CLI
      - name: Deploy Subscription into Management Group
        run: |
          az deployment tenant create \
            --name "deploy-sub-${{ github.run_number }}" \
            --location "centralus" \
            --template-file "./subscription.bicep" \
            --parameters subscriptionName="sub-prod-landingzone" billingScope="${{ secrets.AZURE_BILLING_SCOPE }}" targetManagementGroupId="mg-enterprise-landing-zones-v4"