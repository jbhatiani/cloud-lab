name: Deploy Azure Governance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-management-group:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull your repository code down to the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to Azure securely via OIDC at the tenant level
      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # 3. Execute the tenant-level deployment directly
      - name: Deploy Management Group
        run: |
          az deployment tenant create \
            --name "deploy-mg-${{ github.run_number }}" \
            --location "centralus" \
            --template-file "./management-group.bicep"