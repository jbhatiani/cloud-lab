name: OPA Policy Compliance Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          opa_version: latest

      - name: Automatically Evaluate All Rego and JSON Files
        run: |
          echo "Discovering and evaluating deployment templates against all policies..."
          
          # Loop through all JSON files in the workspace (excluding hidden git folders)
          for json_file in $(find . -name "*.json" -not -path "*/.*" -not -path "./node_modules/*"); do
            echo "--------------------------------------------------"
            echo "Evaluating input file: $json_file"
            
            # -d . loads ALL .rego files found anywhere in the repository automatically
            opa eval --fail-defined \
              -i "$json_file" \
              -d . \
              "data.azure.deployment.deny[_]"
              
            echo "Passed: $json_file"
          done