name: OPA Policy Compliance Check

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          opa-version: latest

      # This checks all Rego syntax and files in your repository for correctness
      - name: Run OPA Syntax Check
        run: opa check . --strict

      # (Optional) If you want to evaluate your test JSON against your rego file:
      - name: Evaluate Rego Policy against Infrastructure Parameters
        run: |
          echo "Running OPA evaluation..."
          opa eval --fail \
            -i regionuserstorage.json \
            -d regionuserstorage.rego \
            "data.azure.deployment.deny"