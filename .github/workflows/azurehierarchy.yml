name: "Deploy Azure Hierarchy via Terraform"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
    terraform:
      name: "Provision Hierarchy & Resource Group"
      runs-on: ubuntu-latest
  
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
  
        - name: Authenticate to Azure (OIDC using your App User)
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: "1.9.0"
  
        - name: Terraform Init
          run: terraform init
  
        - name: Terraform Apply
          run: terraform apply -auto-approve
          env:
            # Passes your billing scope from GitHub Secrets into Terraform
            TF_VAR_billing_scope_id: ${{ secrets.AZURE_BILLING_SCOPE }}